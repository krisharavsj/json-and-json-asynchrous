<html>
    <head>
        <title>Deliver Tracker</title>\
        <style>
            body{
                background-color: bisque;
                text-align: center;
                font-family: sans-serif;
                padding-top: 30px;
            }
            h1{
                color: coral;
            }
            button{
                background-color: white;
                color: blue;
                padding: 6px;
                border-radius: 8px;
                cursor: pointer;
                margin: 5px;
            }
            div{
                width: 280px auto;
                border: 3px solid cornflowerblue;
                margin: 6px auto;
                text-align: left;
                padding: 14px;
                border-radius: 12px;
            }
        </style>
    </head>
    <body>
        <h1>My Delivery Tracker</h1>
        <button onclick="SaveOrder()">Save Order</button>
        <button onclick="StartDelivery()">Start Delivery</button>
        <div>Json Text: <span id="jsontext"></span></div>
        <div>Loaded Item: <span id="loadeditem"></span></div>
        <div>Loaded Price: <span id="loadedprice"></span></div>
        <div>status: <span id="status"></span></div>
        <div>result: <span id="result"></span></div>

        <script>
            let order={
                Item: "Pizza",
                Price: 5,
                Shop: "My Snack Shop"
            };

            function SaveOrder(){
                let jsonText=JSON.stringify(order);
                let loadedOrder=JSON.parse(jsonText)

                document.getElementById("jsontext").innerHTML=jsonText;
                document.getElementById("loadeditem").innerHTML = loadedOrder.Item;
                document.getElementById("loadedprice").innerHTML = loadedOrder.Price;
            }
            function delay(ms){
                return new Promise(function(resolve){
                    setTimeout(resolve,ms);
                });
            }

            async function StartDelivery(){
                document.getElementById("result").innerHTML="";
                document.getElementById("status").innerHTML = "Order Recieved";
                setTimeout(function(){
                    document.getElementById("status").innerHTML="Kitchen Is Preparing...";
                },1000);

            
            await delay(3000);
            document.getElementById("status").innerHTML="Out For Delivery";
            
            await delay(2000);
                document.getElementById("result").innerHTML = "Your Order Has Arrived";

            }
        </script>
    </body>
</html>
